[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-rbln"
dynamic = ["version"]
description = "Out-of-tree RBLN NPU platform plugin for SGLang Diffusion, backed by torch-rbln."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Rebellions Inc.", email = "support@rebellions.ai" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "sglang[diffusion]==0.5.22",
    "rebel-compiler==0.12.0",
]

[project.optional-dependencies]
device = ["torch-rbln"]
test = ["pytest>=8"]

[project.entry-points."sglang.multimodal_gen.platforms"]
rbln = "sglang_rbln:activate"

[project.entry-points."sglang.multimodal_gen.plugins"]
rbln_hooks = "sglang_rbln.hooks:register"

[tool.setuptools.packages.find]
include = ["sglang_rbln*"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
