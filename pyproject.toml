# SPDX-License-Identifier: Apache-2.0
# Out-of-tree RBLN platform plugin for SGLang Diffusion (python/sglang/multimodal_gen).
[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-rbln"
dynamic = ["version"]
description = "Out-of-tree RBLN NPU platform plugin for SGLang Diffusion, backed by torch-rbln."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Rebellions Inc.", email = "support@rebellions.ai" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "sglang[diffusion]==0.5.22",
    "rebel-compiler==0.12.0",
]

[project.optional-dependencies]
# torch-rbln registers the `rbln` torch device (PrivateUse1). The nexus index and
# the host SDK use different version schemes, so it stays unpinned until that is settled.
device = ["torch-rbln"]
test = ["pytest>=8"]

# Platform: SGLang Diffusion calls activate() in every process and selects the
# plugin with SGLANG_DIFFUSION_PLATFORM_OVERRIDE=rbln when several are installed.
[project.entry-points."sglang.multimodal_gen.platforms"]
rbln = "sglang_rbln:activate"

# General plugin: runs before the worker builds the scheduler; registers hooks
# and out-of-tree CustomOp forwards.
[project.entry-points."sglang.multimodal_gen.plugins"]
rbln_hooks = "sglang_rbln.hooks:register"

[tool.setuptools.packages.find]
include = ["sglang_rbln*"]

[tool.setuptools_scm]
# Builds without .git metadata fall back to this.
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
