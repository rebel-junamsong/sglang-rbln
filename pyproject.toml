[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-rbln"
dynamic = ["version"]
description = "Out-of-tree RBLN NPU platform plugin for SGLang Diffusion."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rebellions Inc.", email = "support@rebellions.ai" }]
keywords = ["sglang", "diffusion", "rbln", "npu", "torch.compile"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "sglang[diffusion]==0.5.21",
    "rebel-compiler>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/rebel-junamsong/sglang-rbln"
Repository = "https://github.com/rebel-junamsong/sglang-rbln"
Issues = "https://github.com/rebel-junamsong/sglang-rbln/issues"

[project.optional-dependencies]
device = ["torch-rbln"]
test = ["pytest>=8", "requests"]

[project.entry-points."sglang.multimodal_gen.platforms"]
rbln = "sglang_rbln:activate"

[project.entry-points."sglang.multimodal_gen.plugins"]
rbln_patches = "sglang_rbln.patches:register"

# The committed uv.lock is the environment every functionality and perf result in
# the PR was measured on. Bump these pins together with the result they produced.
[tool.uv]
constraint-dependencies = [
    "rebel-compiler==0.12.1.dev857+g6872ed32",
    "torch-rbln==0.12.1.dev34+ga2ba49aaf",
    "torch==2.13.0+cpu",
    "torchvision==0.28.0+cpu",
    "torchaudio==2.11.0+cpu",
    "diffusers==0.37.0",
    "transformers==5.12.1",
    "torchcodec==0.15.0+cpu",
    "numpy==2.3.5",
    "scipy==1.17.1",
    "datasets==5.1.0",
]
# sglang 0.5.21 pins flashinfer-python==0.6.18, which asserts a CUDA device at
# import; 0.7.1 does not. flashinfer is never used on RBLN.
override-dependencies = ["flashinfer-python==0.7.1"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "rebellions"
url = "https://pypi.rebellions.in/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
rebel-compiler = { index = "rebellions" }
torch-rbln = { index = "rebellions" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
include = ["sglang_rbln*"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = "-m 'not e2e' --strict-markers --strict-config"
markers = [
    "e2e: launches sglang serve and generates through the HTTP API",
    "npu: needs an RBLN NPU on the host; xfails strictly without one",
    "resident_mode: needs execution mode 'resident' (torch-rbln); xfails strictly in staged mode",
    "device_mode: former name of resident_mode",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
